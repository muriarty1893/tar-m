<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-destructive-foreground: var(--destructive-foreground);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-sans: var(--font-sans);
        --font-heading: var(--font-heading, var(--font-sans));
        --font-serif: var(--font-serif);
        --font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full,
      .rounded-none,
      .rounded-t-full,
      .rounded-t-none,
      .rounded-r-full,
      .rounded-r-none,
      .rounded-b-full,
      .rounded-b-none,
      .rounded-l-full,
      .rounded-l-none,
      .rounded-s-full,
      .rounded-s-none,
      .rounded-e-full,
      .rounded-e-none,
      .rounded-tl-full,
      .rounded-tl-none,
      .rounded-tr-full,
      .rounded-tr-none,
      .rounded-bl-full,
      .rounded-bl-none,
      .rounded-br-full,
      .rounded-br-none,
      .rounded-ss-full,
      .rounded-ss-none,
      .rounded-se-full,
      .rounded-se-none,
      .rounded-es-full,
      .rounded-es-none,
      .rounded-ee-full,
      .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }

      @layer base {
        * {
          @apply border-border outline-ring/50;
        }
        body {
          @apply bg-background text-foreground font-sans;
        }
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

        --background: #f7f0e3;
        --foreground: #3b2a1e;
        --primary: #3b2a1e;
        --primary-foreground: #f7f0e3;
        --secondary: #e6d8bd;
        --secondary-foreground: #3b2a1e;
        --muted: #e9dec9;
        --muted-foreground: #6e5e4e;
        --accent: #c0643b;
        --accent-foreground: #fff8ee;
        --destructive: #b3361f;
        --destructive-foreground: #fff8ee;
        --card: #efe4cf;
        --card-foreground: #3b2a1e;
        --popover: #fbf6ec;
        --popover-foreground: #3b2a1e;
        --border: #dccdb0;
        --input: #fbf6ec;
        --ring: #6b7a3a;
        --chart-1: #6b7a3a;
        --chart-2: #d98e2b;
        --chart-3: #b3361f;
        --chart-4: #a08262;
        --chart-5: #3b2a1e;

        --font-sans: "Atkinson Hyperlegible", sans-serif;
        --font-heading: "Bricolage Grotesque", sans-serif;
        --font-serif: "Playfair Display", serif;
        --font-mono: "JetBrains Mono", monospace;

        --radius: 1.5rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      class="relative min-h-screen w-full overflow-hidden bg-foreground text-background flex flex-col"
    >
      <img
        alt="Kamera görüntüsü"
        src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/8ErRTq5pgUe/components/wTOkKq0L0EK.jpeg"
        class="absolute inset-0 size-full object-cover opacity-90"
      />
      <div class="absolute inset-0 bg-foreground/30"></div>
      <div class="relative flex items-center justify-between px-6 pt-14">
        <button
          class="size-12 rounded-full bg-foreground/60 flex items-center justify-center"
          aria-label="Kapat"
        >
          <iconify-icon icon="solar:close-circle-linear" width="28" height="28"></iconify-icon>
        </button>
        <h1 class="font-heading text-2xl font-bold">Tara</h1>
        <button
          class="size-12 rounded-full bg-foreground/60 flex items-center justify-center"
          aria-label="Flaş"
        >
          <iconify-icon icon="solar:bolt-linear" width="28" height="28"></iconify-icon>
        </button>
      </div>
      <div class="relative flex-1 flex flex-col items-center justify-center px-10">
        <div
          class="relative w-full aspect-[3/4] max-h-[46vh] rounded-[28px] border-2 border-background/80"
        ></div>
        <p class="mt-6 rounded-full bg-foreground/70 px-5 py-3 text-lg font-semibold">
          Yaprağı çerçeveye al
        </p>
      </div>
      <div class="relative pb-10">
        <div class="flex gap-2 overflow-x-auto no-scrollbar px-0">
          <button
            class="ml-6 shrink-0 h-12 px-5 rounded-full bg-accent text-accent-foreground text-lg font-bold"
          >
            Buğday</button
          ><button
            class="shrink-0 h-12 px-5 rounded-full bg-foreground/60 text-background text-lg font-semibold"
          >
            Domates</button
          ><button
            class="shrink-0 h-12 px-5 rounded-full bg-foreground/60 text-background text-lg font-semibold"
          >
            Mısır</button
          ><button
            class="shrink-0 h-12 px-5 rounded-full bg-foreground/60 text-background text-lg font-semibold"
          >
            Ayçiçeği</button
          ><button
            class="shrink-0 h-12 px-5 mr-6 rounded-full bg-foreground/60 text-background text-lg font-semibold"
          >
            Zeytin
          </button>
        </div>
        <div class="mt-6 flex items-center justify-around px-8">
          <button
            class="size-14 rounded-full bg-foreground/60 flex items-center justify-center flex-col gap-0.5"
            aria-label="Galeri"
          >
            <iconify-icon icon="solar:gallery-linear" width="28" height="28"></iconify-icon></button
          ><button
            class="size-24 rounded-full border-4 border-background flex items-center justify-center"
            aria-label="Fotoğraf çek"
          >
            <span class="size-[72px] rounded-full bg-accent"></span></button
          ><button
            class="size-14 rounded-full bg-foreground/60 flex items-center justify-center"
            aria-label="Yardım"
          >
            <iconify-icon icon="solar:question-circle-linear" width="28" height="28"></iconify-icon>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
